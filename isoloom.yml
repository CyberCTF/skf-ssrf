# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Server-Side Request Forgery (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask URL checker that requests any URL it is given from the server, with internal services listening beside it (SSRF). The SKF lab folder python/SSRF is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-ssrf

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.137.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    ports: { web: { port: 5000, protocol: http, publish: 5050 } }
    resources: { cpus: 1, memory_mb: 256 }
    files:
      # The player's flag, placed at each start where the old init script wrote it;
      # without the input the inert dev placeholder.
      - path: /ctf/flag
        input: CTF_FLAG_MAIN
        mode: "0444"
    app:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: /check_existence validates the URL it is asked to fetch
    script: checks/check.sh

message: |
  OWASP SKF Server-Side Request Forgery answers at {{ machines.web.ports.web.url }}.
  The form posts a URL to /check_existence and the server fetches it. From where?
